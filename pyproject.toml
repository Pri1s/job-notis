[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-notis"
version = "0.1.0"
description = "An Azure-hosted Discord notifier for new software engineering internships."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pri" }]
dependencies = [
  "azure-functions>=1.21.0,<2",
  "azure-identity>=1.19.0,<2",
  "azure-storage-blob>=12.25.0,<13",
  "httpx>=0.28.0,<1",
]

[project.scripts]
job-notis = "job_notis.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/job_notis"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["job_notis"]
